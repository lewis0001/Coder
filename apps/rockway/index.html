<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1" />
  <meta name="theme-color" content="#d4112a" />
  <title>Rockway — Gibraltar's local marketplace</title>
  <meta name="description" content="Rockway is Gibraltar's local marketplace: discover and book local businesses, check the frontier, read live local news, and find events, jobs, property and classifieds — all on the Rock." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23d4112a'/><text x='50' y='70' font-size='60' text-anchor='middle' fill='%23f3b21b'>🔑</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&display=swap" rel="stylesheet" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="assets/icon-192.png" />
  <link rel="stylesheet" href="src/styles.css" />
</head>
<body>
  <div class="frame-wrap">
    <div class="phone">
      <div id="app"></div>
    </div>
  </div>

  <!-- Core (load order matters) -->
  <script src="src/core/util.js"></script>
  <script src="src/core/icons.js"></script>
  <script src="src/core/store.js"></script>
  <script src="src/core/registry.js"></script>
  <script src="src/core/ui.js"></script>
  <script src="src/core/rock.js"></script>
  <script src="src/core/live.js"></script>
  <script src="src/core/router.js"></script>
  <!-- Boot loads all feature modules from its manifest -->
  <script src="src/core/boot.js"></script>
  <script>
    // PWA: register the service worker (http/https only — file:// runs without it)
    if ('serviceWorker' in navigator && /^http/.test(location.protocol)) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').catch(function () {});
      });
    }
  </script>
</body>
</html>
